/* Maketas: kalbų jungiklis, antraštė su besisukančia plokštele, paieškos skydelis, filtrai, kortelės sugrupuotos pagal regioną */
:root{
  --bg:#ECEEF1;
  --surface:#FFFFFF;
  --ink:#14181F;
  --ink2:#4B5463;
  --line:#C9CFD8;
  --sticker:#F4C430;
  --stickerInk:#14181F;
  --disc:#0B0E12;
  --groove:#232932;
  --focus:#1D5BD1;
  --font-d:"Barlow Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --font-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1318;--surface:#171C23;--ink:#EDF0F4;--ink2:#A5AEBB;--line:#2C343F;
    --disc:#06080B;--groove:#1D232B;--focus:#8DB8FF;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1318;--surface:#171C23;--ink:#EDF0F4;--ink2:#A5AEBB;--line:#2C343F;
  --disc:#06080B;--groove:#1D232B;--focus:#8DB8FF;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 1rem/1.5 var(--font-b);
  padding-block:24px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:68rem;margin:0 auto;display:flex;flex-direction:column;gap:28px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.langs button{font:500 .8rem var(--font-m);letter-spacing:.05em;padding:6px 10px}

.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
h1{
  margin:0;font:700 clamp(2.6rem,11vw,5.2rem)/.92 var(--font-d);
  text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;
}
.lede{margin:12px 0 0;max-width:36rem;color:var(--ink2)}
.disc{
  width:clamp(92px,22vw,180px);aspect-ratio:1;border-radius:50%;
  border:1px solid var(--line);
  background:
    conic-gradient(from 0deg,transparent 0 18%,rgba(255,255,255,.12) 24%,transparent 30% 68%,rgba(255,255,255,.12) 74%,transparent 80%),
    radial-gradient(circle,var(--bg) 0 2.6%,var(--sticker) 3% 17%,transparent 17.4%),
    repeating-radial-gradient(circle,var(--disc) 0 2px,var(--groove) 2px 3px);
  animation:spin 16s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}

.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:2px;
  padding:16px;display:flex;flex-direction:column;gap:14px;
}
.lab{font:500 .72rem var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
#q{
  width:100%;font:500 1.25rem var(--font-b);padding:12px 14px;
  border:2px solid var(--ink);border-radius:2px;background:var(--bg);color:var(--ink);
}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip,.mini{
  font:500 .9rem var(--font-b);padding:7px 12px;border:1px solid var(--line);
  background:transparent;color:var(--ink);border-radius:2px;cursor:pointer;
}
.mini{font-size:.82rem;padding:5px 10px}
.chip:hover,.mini:hover{border-color:var(--ink)}
.chip[aria-pressed="true"],.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink2);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink);flex:none}
#msg{font-size:.85rem;color:var(--ink2);min-height:1.2em}

.filters{display:flex;flex-direction:column;gap:12px}
.fgroup{display:flex;flex-direction:column;gap:6px}
.count{font:500 .8rem var(--font-m);color:var(--ink2)}

.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{
  margin:0;font:700 1.7rem/1 var(--font-d);text-transform:uppercase;letter-spacing:.03em;
  display:flex;gap:10px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;
}
.sec h2 span{font:500 .8rem var(--font-m);color:var(--ink2);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:12px}
.card{
  min-width:0;display:flex;flex-direction:column;gap:10px;padding:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:2px;
}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3{margin:0;font:600 1.1rem/1.25 var(--font-b);overflow-wrap:anywhere}
.cc{font:500 .75rem var(--font-m);color:var(--ink2)}
.tag{
  align-self:flex-start;font:500 .68rem var(--font-m);text-transform:uppercase;letter-spacing:.07em;
  background:var(--sticker);color:var(--stickerInk);padding:2px 7px;transform:rotate(-1.5deg);
}
.note{margin:0;color:var(--ink2);font-size:.9rem}
.go{
  margin-top:auto;display:block;padding:10px 12px;border-radius:2px;
  background:var(--ink);color:var(--surface);text-decoration:none;font-weight:600;font-size:.92rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.go:hover{background:var(--sticker);color:var(--stickerInk)}
.empty{padding:24px;border:1px dashed var(--line);color:var(--ink2)}
.foot{color:var(--ink2);font-size:.85rem;max-width:44rem;margin:0}
</style>

</head>

</div>
